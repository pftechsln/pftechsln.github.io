<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMART App Launch</title>
    <!-- TailwindCSS via CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Smart On FHIR ehr launch script-->
    <script src="/js/ehr-launch/launch.js" defer></script>
    <script defer>
          document.addEventListener('DOMContentLoaded', () => startSmartLaunchFlow({
            clientId: '2d8f64b0-ecae-42c4-8351-794141c1b67e', //'d45049c3-3441-40ef-ab4d-b9cd86a17225',
            redirectUri: 'http://127.0.0.1:5500/ehr-redirect.html',
            debug: true
        }));
    </script>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-center bg-sky-50 text-slate-800 p-8">
    <h1 class="text-2xl font-semibold mb-4">Launching SMART on FHIR App&hellip;</h1>

    <!-- Debug container where parsed parameters will be displayed -->
    <div id="debug" class="w-full p-4 rounded-2xl shadow-md bg-white border border-slate-200 text-sm font-mono whitespace-pre overflow-x-auto hidden"></div>

  </body>
</html>
